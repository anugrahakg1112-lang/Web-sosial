<!DOCTYPE html>

            >

                <img
                    src="assets/icons/whatsapp.png"

                    <strong>YouTube</strong>

                target="_blank"

                    src="assets/icons/instagram.png"

                >

                <div class="social-info">
                    <strong>Instagram</strong>
                    <small>@muhanugraharun.s</small>
