<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>DANCOGEMING</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- ANIMASI PEMBUKA -->
    <div id="intro">

        <div class="person">
            <div class="head"></div>
            <div class="body"></div>
            <div class="arm arm-left"></div>
            <div class="arm arm-right"></div>
        </div>

        <div class="banner">
            <h1>DANCOGEMING</h1>
            <p>Gaming • Content • Community</p>
        </div>

    </div>


    <!-- HALAMAN UTAMA -->
    <main id="main-content">

        <section class="profile">

            <div class="profile-logo">
                <img src="assets/icons/youtube.png" alt="DANCOGEMING">
            </div>

            <h1>DANCOGEMING</h1>

            <p class="username">@dancogeming</p>

            <p class="description">
                Gaming • Content • Community
            </p>

            <p class="status">
                🟢 Online Community
            </p>

        </section>


        <!-- LINK SOSIAL -->
        <section class="social-links">

            <a href="#" class="social-card">
                <img src="assets/icons/whatsapp.png" alt="WhatsApp">
                <span>WhatsApp Group</span>
            </a>

            <a href="#" class="social-card">
                <img src="assets/icons/youtube.png" alt="YouTube">
                <span>YouTube</span>
            </a>

            <a href="#" class="social-card">
                <img src="assets/icons/tiktok.png" alt="TikTok">
                <span>TikTok</span>
            </a>

            <a href="#" class="social-card">
                <img src="assets/icons/instagram.png" alt="Instagram">
                <span>Instagram</span>
            </a>

        </section>


        <footer>
            <p>© 2026 DANCOGEMING</p>
            <p>Gaming • Content • Community</p>
        </footer>

    </main>


    <script src="js/script.js"></script>

</body>
</html>
